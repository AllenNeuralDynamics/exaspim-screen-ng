[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exaspim-screen-ng"
version = "0.1.0"
description = "Write exaSPIM 1X screening Neuroglancer links to Smartsheet and generate derived asset metadata."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aind-data-schema>=2.9.1,<3",
    "smartsheet-python-sdk==4.2.0",
]

[project.scripts]
exaspim-screen-ng = "exaspim_screen_ng.cli:main"

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/exaspim-screen-ng"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/exaspim_screen_ng"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=exaspim_screen_ng --cov-report=term-missing"
